[package]
name = "codex-switch"
version = "0.1.4"
edition = "2024"
description = "本地 Codex 配置管理工具，支持账号、供应商、模型配置切换与主题管理。"
repository = "https://github.com/luoluoqixi/codex-switch"

[package.metadata.bundle]
name = "Codex Switch"
identifier = "com.luoluoqixi.codex-switch"
icon = ["assets/icon.ico", "assets/icon.icns", "assets/icon.png"]
category = "Utility"
copyright = "Copyright (c) 2026 luoluoqixi"

[package.metadata.bundle.osx]
minimum_system_version = "12.0"

[dependencies]
gpui-kit = { version = "0.9.1", features = ["gpui-fast", "syntect"] }
anyhow = "1"
async-channel = "2"
chrono = "0.4"
serde_json = "1"
sys-locale = "0.3"
tempfile = "3"
toml = "0.8"
base64 = "0.22"
sha2 = "0.10"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6"
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts"] }

# cargo run --example generate-icon
[[example]]
name = "generate-icon"
path = "tools/generate-icon.rs"

[profile.release]
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true        # Enables link to optimizations
opt-level = "s"   # Optimize for binary size
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Remove debug symbols
